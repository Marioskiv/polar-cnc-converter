# Polar CNC — LinuxCNC SIMULATION of the XZC lathe conversion with a 3D model.
#
# No hardware: LIB:basic_sim.tcl simulates the joints, polarlathe.hal feeds
# their positions to the vismach model (polarlathe.py). Motion values below
# are copied from the real machine config (holzmann_cnc_mesa_7i92.ini), so the
# planner, limits, accelerations and homing behave like the real machine.
# Keep them in step when the real .ini changes (X layout is still pending!).
#
# Copyright (c) 2026 Marioskiv
# https://github.com/Marioskiv/polar-cnc-converter
# SPDX-License-Identifier: MIT

[EMC]
MACHINE = polarlathe-sim
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
GEOMETRY = XZC
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
DEFAULT_LINEAR_VELOCITY = 6.0
MAX_LINEAR_VELOCITY = 25.0
DEFAULT_ANGULAR_VELOCITY = 60.000000
MAX_ANGULAR_VELOCITY = 120.000000
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm
# The real .ini has CYCLE_TIME = 100 (a typo, seconds); 0.100 is intended.
CYCLE_TIME = 0.100
PROGRAM_PREFIX = ./

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = sim.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.025

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
HALFILE = LIB:basic_sim.tcl -no_sim_spindle
HALFILE = polarlathe.hal

[HALUI]

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XZC

[TRAJ]
COORDINATES = XZC
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.50
MAX_LINEAR_VELOCITY = 25.00
DEFAULT_ANGULAR_VELOCITY = 60.00
MAX_ANGULAR_VELOCITY = 120.00

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = sim.tbl

# ---- X: radius, 0 on the chuck centreline (synced with the real .ini 2026-10-04:
#      switch at X -20, machining 0 .. +113 on the rigid side) ----------------
# Current real values. When the X layout is finalised (planned about
# -10 .. +125 mm), change MIN_LIMIT / MAX_LIMIT / HOME_OFFSET here AND in the
# real .ini AND in the converter's X Axis Min/Max.
[AXIS_X]
MAX_VELOCITY = 18.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -18.0
MAX_LIMIT = 113.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
FERROR = 10.0
MIN_FERROR = 1.0
MAX_VELOCITY = 18.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -18.0
MAX_LIMIT = 113.0
HOME_OFFSET = -20.0
HOME_SEARCH_VEL = -3.000000
HOME_LATCH_VEL = 0.500000
HOME_FINAL_VEL = 5.000000
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 2

# ---- Z: axial, switch at the TAILSTOCK end (positive). Machine Z0 is at the
#      CHUCK end — this is why G53 G0 Z0 must never reach this machine. ------
[AXIS_Z]
MAX_VELOCITY = 25.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -590.0
MAX_LIMIT = 7.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
FERROR = 10.0
MIN_FERROR = 1.0
MAX_VELOCITY = 25.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -590.0
MAX_LIMIT = 7.0
HOME_OFFSET = 10.0
HOME_SEARCH_VEL = 3.000000
HOME_LATCH_VEL = -2.500000
HOME_FINAL_VEL = 5.000000
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1

# ---- C: chuck, continuous, homes in place ------------------------------------
[AXIS_C]
MAX_VELOCITY = 120.0
MAX_ACCELERATION = 360.0
MIN_LIMIT = -99999.0
MAX_LIMIT = 99999.0

[JOINT_2]
TYPE = ANGULAR
HOME = 0.0
FERROR = 10.0
MIN_FERROR = 1.0
MAX_VELOCITY = 120.0
MAX_ACCELERATION = 360.0
MIN_LIMIT = -99999.0
MAX_LIMIT = 99999.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 3
