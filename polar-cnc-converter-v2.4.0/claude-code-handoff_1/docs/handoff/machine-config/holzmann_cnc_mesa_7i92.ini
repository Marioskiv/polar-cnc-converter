# holzmann_cnc_mesa_7i92.ini
# Originally generated by PNCconf 12 Jun 2026 - since edited by hand.
# DO NOT re-run PNCconf on this config: it will overwrite these changes.
#
# Machine: lathe converted to CNC. Router mounted on the X slide, parallel
# to Z, facing the chuck. X = radius, Z = axial, C = chuck rotation.
# G-code comes from the polar converter as X/C/Z with G93 inverse time feed.
#
# ===========================================================================
# JOINT NUMBERING - READ THIS BEFORE CHANGING ANYTHING
#
# LinuxCNC pairs joints with axes in CANONICAL letter order (X Y Z A B C),
# not in the order you type them. So with coordinates=XZC:
#
#     joint 0  ->  X   ->  stepgen.00   (BOB X terminals)
#     joint 1  ->  Z   ->  stepgen.02   (BOB Z terminals)
#     joint 2  ->  C   ->  stepgen.01   (BOB Y terminals - the chuck)
#
# Joint 2 drives stepgen.01. That looks odd but it is correct: the joint
# number is just an index, and it is free to point at any stepgen. What
# matters is that the letters here are in canonical order, otherwise
# check_config compares the wrong joint against the wrong axis and refuses
# to start.
# ===========================================================================
#
# MECHANICS
#   X : 2.0 mm pitch screw, 400 steps/mm  = 800 steps/rev = 1/4 microstep
#   Z : 2.0 mm pitch screw, 400 steps/mm  = 800 steps/rev = 1/4 microstep
#   C : HTD 5M belts, motor 20T -> 48T, same shaft 20T -> chuck 86T
#       ratio = (48/20) x (86/20) = 2.4 x 4.3 = 10.32 : 1
#       3200 motor steps/rev x 10.32 / 360 = 91.733333 steps per degree
#       (CHANGED 2026-10-04: new open-loop C driver. Measured G0 C360 = 180 deg
#        with 45.866667, so the driver is at 3200 steps/rev; one of its DIP
#        switches is broken and it stays at 3200.)
#
# TRAVEL
#   X : 135 mm travel. CHANGED 2026-10-04: router in the former tool-post
#       position; cutter on the chuck centreline 20 mm from the X switch.
#       X = -20 at the switch, 0 at the centre, +115 at the far end.
#   Z : 600 mm, switch at the tailstock end. CHANGED 2026-10-04: numbered
#       like a mill - machine Z0 is the home park (10 mm from the switch),
#       the work area is negative, towards the chuck.
#   C : continuous, no switch
#
# ACCELERATION
# Deliberately low. The LinuxCNC stepper documentation recommends starting
# around 50 mm/s^2 and raising it experimentally. 100 mm/s^2 gives a 2 mm
# stopping distance at 20 mm/s (d = 0.5 * v^2 / a), which is smooth without
# being sluggish. Raise it gradually and watch for lost steps - all three
# axes run open loop, so a stalled motor produces no error at all, just a
# wrong part.
#
# CALIBRATION STILL TO DO
# [JOINT_0]HOME_OFFSET is set to 135, which assumes the tool sits exactly
# 135 mm from the chuck centreline when the X switch trips. Measure the
# real distance and correct it. X must read TRUE RADIUS or every polar
# program will come out wrong.
[EMC]
MACHINE = holzmann_cnc_mesa_7i92
DEBUG = 0
VERSION = 1.1
[DISPLAY]
DISPLAY = axis
# ADDED 2026-10-02: lathe layout in AXIS - top view of the X/Z plane, jog order
# Z then X, lathe tool table and touch-off. Display and jogging only: AXIS does
# NOT switch the interpreter to diameter mode (G7). X stays a RADIUS (G8), which
# the polar converter requires - so never add G7 to RS274NGC_STARTUP_CODE.
# If X appears mirrored on screen compared with the real machine (tool on the
# other side of the centreline), also add:  BACK_TOOL_LATHE = 1
LATHE = 1
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.000000
MIN_SPINDLE_OVERRIDE = 0.500000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
PROGRAM_PREFIX = /home/marioscnc/linuxcnc/nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm
DEFAULT_LINEAR_VELOCITY = 6.000000
MAX_LINEAR_VELOCITY = 25.000000
MIN_LINEAR_VELOCITY = 0.500000
# CHANGED 2026-10-04: 12 -> 60 deg/s (10 chuck rpm) default C jog speed in
# AXIS; the slider still goes up to MAX_ANGULAR_VELOCITY.
DEFAULT_ANGULAR_VELOCITY = 60.000000
# CHANGED 2026-10-04: 90 -> 120 deg/s, matches [AXIS_C] MAX_VELOCITY.
MAX_ANGULAR_VELOCITY = 120.000000
MIN_ANGULAR_VELOCITY = 1.666667
EDITOR = gedit
GEOMETRY = XZC
# CHANGED 2026-10-02: was 100 (a typo - this value is in SECONDS, so the
# screen was refreshed every 100 s). 0.100 = 10 refreshes per second.
CYCLE_TIME = 0.100
# ADDED 2026-10-02: start with NO program loaded. With LATHE = 1, AXIS would
# otherwise load its lathe splash file axis-lathe.ngc - an inch (G20) demo
# that says itself it is "not intended for actual milling" but would move
# X and Z on this machine if Cycle Start were pressed by mistake.
OPEN_FILE = ""
# ADDED 2026-10-02: AXIS customisations for this configuration only (file in
# the same folder as this INI). Used instead of ~/.axisrc so that other
# configurations, e.g. the vismach simulation, are not affected.
USER_COMMAND_FILE = axis_user.py
[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python
[TASK]
TASK = milltask
CYCLE_TIME = 0.010
[RS274NGC]
PARAMETER_FILE = linuxcnc.var
# CHANGED 2026-10-02: added G8 (radius mode) at the end. X must be a RADIUS for
# the polar converter; with LATHE = 1 a diameter-mode (G7) program could
# otherwise leave the interpreter in G7. AXIS also uses this line for preview.
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.025 G8
[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000
[HMOT]
# **** This is for info only ****
CARD0=hm2_7i92.0
[HAL]
HALUI = halui
HALFILE = holzmann_cnc_mesa_7i92.hal
HALFILE = custom.hal
# ADDED 2026-10-02: PS4/PS5 gamepad jogging (L1 = deadman).
# Must stay AFTER the main .hal, which creates the jog signals it uses.
# If the gamepad is not plugged in (USB), LinuxCNC will not start:
# put a # at the start of the next line to disable it.
HALFILE = gamepad.hal
POSTGUI_HALFILE = custom_postgui.hal
SHUTDOWN = shutdown.hal
[HALUI]
# ADDED 2026-10-03: gamepad "touch off Z" (L1 + D-pad down in gamepad.hal,
# pin halui.mdi-command-00). The current tool tip becomes Z0 of the ACTIVE
# work offset (P0). Never add an X touch-off here: work X0 must stay the
# chuck centre for the polar converter.
MDI_COMMAND = G10 L20 P0 Z0

[KINS]
JOINTS = 3
# Canonical order. joint 0 = X, joint 1 = Z, joint 2 = C.
KINEMATICS = trivkins coordinates=XZC
[TRAJ]
COORDINATES = XZC
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.50
MAX_LINEAR_VELOCITY = 25.00
# CHANGED 2026-10-04: 12 -> 60 deg/s, same as [DISPLAY].
DEFAULT_ANGULAR_VELOCITY = 60.00
# CHANGED 2026-10-04: 90 -> 120 deg/s, matches [AXIS_C] MAX_VELOCITY.
MAX_ANGULAR_VELOCITY = 120.00
[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
#******************************************
# X = radial axis - distance from the chuck centreline
# joint 0 -> stepgen.00 -> BOB X terminals
#
# LAYOUT CHANGED 2026-10-04 (router moved to the former tool-post position):
#   switch X = -20   |   chuck centre X = 0   |   far end X = +115
# Machining only from the centre towards the far end (the rigid side).
#
# X must count UP as the tool moves AWAY from the chuck centre (a true
# radius - the polar converter depends on it). With the router on this side
# that means moving AWAY from the switch, so STEP_SCALE is now NEGATIVE.
# (It was once negative with the router on the OTHER side, which mirrored
# every program - the sign must always follow the router's side.)
#
# The switch is now at the NEGATIVE end: homing searches negative and the
# switch is the negative limit (see the .hal). HOME_OFFSET = -20 gives the
# switch its coordinate; HOME = 0 parks the cutter on the chuck centre, where
# the router is aligned mechanically - so X 0 is the centre by construction.
#******************************************
[AXIS_X]
MAX_VELOCITY = 18.0
MAX_ACCELERATION = 100.0
# CHANGED 2026-10-04: 2 mm short of the switch (was 0.0)
MIN_LIMIT = -18.0
# CHANGED 2026-10-04: 2 mm short of the far end (was 133.0)
MAX_LIMIT = 113.0
[JOINT_0]
TYPE = LINEAR
# CHANGED 2026-10-04: park on the chuck centre (20 mm from the switch) - the
# router is aligned there. Was 67.5. Set 108 later to park at the far edge.
HOME = 0.0
FERROR = 10.0
MIN_FERROR = 1.0
MAX_VELOCITY = 18.0
MAX_ACCELERATION = 100.0
# The values below should be 25% larger than MAX_VELOCITY and MAX_ACCELERATION
STEPGEN_MAXVEL = 22.50
STEPGEN_MAXACCEL = 125.00
P = 1000.0
I = 0.0
D = 0.0
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
BIAS = 0.0
DEADBAND = 0.0
MAX_OUTPUT = 0.0
# these are in nanoseconds
DIRSETUP   = 10000
DIRHOLD    = 10000
STEPLEN    = 5000
STEPSPACE  = 5000
# CHANGED 2026-10-04: sign flipped - X now grows AWAY from the switch.
# Only valid with the router in the new position (see the note above).
STEP_SCALE = -400.0
# CHANGED (was 0.0)
MIN_LIMIT = -18.0
# CHANGED (was 133.0)
MAX_LIMIT = 113.0
# CHANGED: the switch is X -20 (was 135). Exact by construction: the router
# is aligned to the chuck centre with the slide at X 0 after homing.
HOME_OFFSET = -20.0
# CHANGED: switch is at the NEGATIVE end
HOME_SEARCH_VEL = -3.000000
# CHANGED: back off in the positive direction
HOME_LATCH_VEL = 0.500000
HOME_FINAL_VEL = 5.000000
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 2
#******************************************
#******************************************
# Z = axial axis
# joint 1 -> stepgen.02 -> BOB Z terminals
#
# Travel is 600 mm and the switch is at the tailstock end, which is the
# positive end.
#
# CHANGED 2026-10-04: machine Z is now numbered like a MILL (the machine is a
# mill with a rotary table): machine Z0 is the home park position, 10 mm clear
# of the switch, and everything towards the chuck is negative. So a CAM's
# "G53 G0 Z0" retract goes to the park position - safe - exactly as on a mill.
# Before, machine Z0 was at the CHUCK end and G53 G0 Z0 would have rapided
# towards the chuck. The machine moves exactly as before: all values are the
# old ones minus 590 (switch 600 -> 10, park 590 -> 0, soft limit 597 -> 7,
# chuck end 0 -> -590).
# After this change the work offsets (G54 Z) must be touched off again.
#
# The old file had HOME_OFFSET = 6400 and HOME = 6400 with MAX_LIMIT 6500.
# That parked the carriage exactly on the switch after every homing run,
# which is what produced the repeated limit-switch errors.
#******************************************
[AXIS_Z]
MAX_VELOCITY = 25.0
MAX_ACCELERATION = 100.0
# CHANGED 2026-10-04: was 0.0 (mill-style numbering, see above)
MIN_LIMIT = -590.0
# CHANGED 2026-10-04: was 597.0 (3 mm short of the switch)
MAX_LIMIT = 7.0
[JOINT_1]
TYPE = LINEAR
# CHANGED 2026-10-04: was 590.0. Park = machine Z0 = safe retract (G53 G0 Z0).
HOME = 0.0
FERROR = 10.0
MIN_FERROR = 1.0
MAX_VELOCITY = 25.0
MAX_ACCELERATION = 100.0
# STEPGEN_MAXACCEL is 100% larger because backlash compensation is on
STEPGEN_MAXVEL = 31.25
STEPGEN_MAXACCEL = 200.00
P = 1000.0
I = 0.0
D = 0.0
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
BIAS = 0.0
DEADBAND = 0.0
MAX_OUTPUT = 0.0
# these are in nanoseconds
DIRSETUP   = 10000
DIRHOLD    = 10000
STEPLEN    = 5000
STEPSPACE  = 5000
STEP_SCALE = 400.0
BACKLASH = 0.3
# CHANGED 2026-10-04: was 0.0 (mill-style numbering, see above)
MIN_LIMIT = -590.0
# CHANGED 2026-10-04: was 597.0 (3 mm short of the switch)
MAX_LIMIT = 7.0
# CHANGED 2026-10-04: was 600.0. The switch is 10 mm above the park position.
HOME_OFFSET = 10.0
HOME_SEARCH_VEL = 3.000000
HOME_LATCH_VEL = -2.500000
HOME_FINAL_VEL = 5.000000
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
#******************************************
#******************************************
# C = chuck rotation, replaces the old Y axis
# joint 2 -> stepgen.01 -> BOB Y terminals
#
# This is the "Immediate Homing" arrangement from the LinuxCNC manual, the
# documented way to handle a rotary joint with no switch and no meaningful
# home position: search and latch velocities both zero, no index, and a
# valid HOME_SEQUENCE so that Home All still includes it. Pressing Home
# marks the chuck homed where it stands, without moving it.
#
# HOME_FINAL_VEL is deliberately absent. The manual says the value must be
# a positive number, and there is no final move to make here anyway.
#******************************************
[AXIS_C]
# CHANGED 2026-10-04: 90 -> 120 deg/s and 180 -> 360 deg/s^2.
# 120 deg/s = 20 chuck rpm = 206 motor rpm on the 10.32:1 belts. The 57-112
# (3 N.m) on 48 V starts losing torque around 350 motor rpm, so this keeps
# about 40% margin. Acceleration: the reflected rotor inertia dominates and
# 360 deg/s^2 needs only a small fraction of the motor torque.
MAX_VELOCITY = 120.0
MAX_ACCELERATION = 360.0
MIN_LIMIT = -99999.0
MAX_LIMIT = 99999.0
[JOINT_2]
TYPE = ANGULAR
HOME = 0.0
FERROR = 10.0
MIN_FERROR = 1.0
# CHANGED 2026-10-04: same as [AXIS_C]; stepgen limits stay 25% higher.
# At 3200 steps/rev: 120 deg/s = 11,008 steps/s, 150 deg/s = 13,760 steps/s.
MAX_VELOCITY = 120.0
MAX_ACCELERATION = 360.0
STEPGEN_MAXVEL = 150.00
STEPGEN_MAXACCEL = 450.00
P = 1000.0
I = 0.0
D = 0.0
FF0 = 0.0
FF1 = 1.0
FF2 = 0.0
BIAS = 0.0
DEADBAND = 0.0
MAX_OUTPUT = 0.0
# these are in nanoseconds
DIRSETUP   = 10000
DIRHOLD    = 10000
STEPLEN    = 5000
STEPSPACE  = 5000
# CHANGED 2026-10-04: C driver at 3200 steps/rev (measured: 45.866667 gave
# 180 deg for G0 C360). 3200 x 10.32 / 360 = 91.733333.
# For other driver settings: 800 -> 22.933333, 1600 -> 45.866667.
STEP_SCALE = 91.733333
MIN_LIMIT = -99999.0
MAX_LIMIT = 99999.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 3
#******************************************
[SPINDLE_0]
P = 0
I = 0
D = 0
FF0 = 1
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 2000